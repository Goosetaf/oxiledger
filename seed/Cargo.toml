[package]
name = "oxiledger-seed"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
argon2 = "0.5"
chrono = { version = "0.4", features = ["clock"] }
dotenvy = "0.15"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "rust_decimal", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = "1"
