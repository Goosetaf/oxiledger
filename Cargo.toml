[package]
name = "oxiledger"
version = "0.1.0"
authors = ["Goostaf <gasplund2@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
dioxus-router = "0.7.3"
dioxus-free-icons = { version = "0.10", features = ["lucide"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
strum = { version = "0.27", features = ["derive"] }

# Server-only dependencies (optional, enabled by the server feature)
diesel = { version = "2.3", default-features = false, features = ["postgres", "sqlite", "r2d2", "uuid", "chrono", "serde_json", "returning_clauses_for_sqlite_3_35"], optional = true }
diesel_migrations = { version = "2.3", features = ["postgres", "sqlite"], optional = true }
pq-sys = { version = "0.7", features = ["bundled_without_openssl"], optional = true }
libsqlite3-sys = { version = "0.35", features = ["bundled"], optional = true }
async-trait = { version = "0.1", optional = true }
argon2 = { version = "0.5", optional = true }
axum = { version = "0.8", optional = true }
dioxus-server = { version = "0.7", optional = true }
dotenvy = { version = "0.15", optional = true }
tower-cookies = { version = "0.10", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-cron-scheduler = { version = "0.15", optional = true }
openidconnect = { version = "4", features = ["reqwest"], optional = true }
reqwest = { version = "0.12", features = ["json"], default-features = false, optional = true }
jsonwebtoken = { version = "9", optional = true }
urlencoding = { version = "2", optional = true }
web-sys = { version = "0.3", features = ["Window", "Location"], optional = true }

[features]
default = ["web"]
web     = ["dioxus/web", "dep:web-sys"]
desktop = ["dioxus/desktop"]
mobile  = ["dioxus/mobile"]
server  = ["dioxus/server", "dep:diesel", "dep:diesel_migrations", "dep:pq-sys", "dep:libsqlite3-sys", "dep:async-trait", "rust_decimal/db-diesel-postgres", "dep:argon2", "dep:axum", "dep:dioxus-server", "dep:dotenvy", "dep:tower-cookies", "dep:tokio", "dep:tokio-cron-scheduler", "dep:openidconnect", "dep:reqwest", "reqwest/rustls-tls", "dep:jsonwebtoken", "dep:urlencoding"]
